<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Agenda Eletrônica</title>
    <link rel="stylesheet" href="/ex5/css/index.css">
</head>
<body>
    <div class="container">
    <h2>Agenda Eletrônica</h2>

    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome">
    <br>

    <label for="telefone">Telefone:</label>
    <input type="number" id="telefone" name="telefone">
    <br>
        <div id="mensagem"></div>
    <button id="btnadicionar">Adicionar Contato</button>
    <button id="btnexibir">Exibir Contatos</button>
    
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Telefone</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script src="/ex5/js/index.js"></script>
    </main>
    </div>
</body>
</html>
